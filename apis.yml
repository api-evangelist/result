apis:
- name: Result MCP Server
  description: >-
    Remote Model Context Protocol server exposing 74 tools across six categories (plan and
    operate, build and ship, Company Brain, audience growth, sell and support, run the
    company) — the same tools Result uses inside the product, under the same validation,
    permission and business-ownership rules. Requires an OAuth 2.1 authorization-code flow
    against Descope; anonymous tools/list returns 401 invalid_token.
  humanURL: https://result.dev/mcp
  baseURL: https://api.result.dev/mcp
  tags:
  - Model Context Protocol
  - Agents
  - Business Operations
  properties:
  - type: MCPServer
    url: mcp/result-mcp.yml
  - type: Documentation
    url: https://result.dev/mcp
- name: Result Backend
  description: >-
    Hosted application backend consumed through the first-party @resultdev/sdk client and
    administered with @resultdev/cli: PostgREST-style queries against Postgres with
    row-level security, Google/GitHub OAuth and email-password authentication, public and
    private file storage with signed URLs, WebSocket realtime channels with presence,
    serverless Deno functions, hosted AI chat/streaming/embeddings/image generation,
    transactional email, cookieless web analytics, embedded customer support and
    subscription payments. The base URL is issued per application in the Result dashboard
    as NEXT_PUBLIC_BACKEND_URL; Result publishes no fixed public API host and directs
    developers to the SDK rather than hand-rolled HTTP.
  humanURL: https://docs.result.dev/
  baseURL: '{NEXT_PUBLIC_BACKEND_URL}'
  x-base-url-note: >-
    Templated. Each Result app is provisioned its own backend base URL, shown on the app's
    page in the Result dashboard and read from NEXT_PUBLIC_BACKEND_URL. The docs never
    name a shared production host, so no fixed baseURL is recorded rather than guessing
    one from the domain.
  tags:
  - Backend as a Service
  - Database
  - Authentication
  - Storage
  - Serverless
  - Realtime
  properties:
  - type: Documentation
    url: https://docs.result.dev/
  - type: GettingStarted
    url: https://docs.result.dev/
  - type: Authentication
    url: authentication/result-authentication.yml
- name: Result Support Widget
  description: >-
    Embeddable customer-support launcher, loaded either as a plain script tag from
    https://result.dev/widget.js with a data-support handle or via @resultdev/sdk
    support.mount(). It opens the business's own public support page in an iframe panel;
    conversations land in the business's Result support inbox. Rate limited by the support
    API to 5 new conversations per IP per hour and 30 messages per IP per 10 minutes.
  humanURL: https://docs.result.dev/sdk/support
  baseURL: https://support.{handle}.withresult.com
  x-base-url-note: >-
    Templated per business handle, taken verbatim from the provider's own widget.js
    (`https://support.${label}.withresult.com`). withresult.com is a Result-controlled
    wildcard domain on the same Cloudflare nameservers as result.dev.
  tags:
  - Customer Support
  - Embedded Components
  properties:
  - type: Documentation
    url: https://docs.result.dev/sdk/support
  - type: Components
    url: components/result-components.yml
